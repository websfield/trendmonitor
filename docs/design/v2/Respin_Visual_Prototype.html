<script id="respin-documents" type="application/json">{"studio": {"template": "\n<div class=\"rp-shell\" style=\"display:grid;grid-template-columns:{{ shellCols }};min-height:100vh;background:var(--color-bg);color:var(--color-text);font-size:15px\">\n<aside class=\"rp-sidebar\" style=\"display:{{ railDisplay }};\">\n<a aria-label=\"Respin Studio\" class=\"wordmark\" data-go=\"studio\" href=\"#studio\"><span aria-hidden=\"true\" class=\"brand-mark\"><b><\/b><b><\/b><b><\/b><\/span>Respin<span aria-hidden=\"true\" class=\"brand-spark\">✧<\/span><\/a>\n<span class=\"rail-label\">YOUR CREATIVE SPACE<\/span>\n<nav aria-label=\"Workspace\" class=\"main-nav\"><sc-for as=\"n\" list=\"{{ nav }}\"><a aria-current=\"{{ n.current }}\" class=\"nav-link\" href=\"#\" onclick=\"{{ n.go }}\" style=\"color:{{ n.color }};background:{{ n.bg }}\"><i aria-hidden=\"true\" class=\"ph {{ n.icon }}\"><\/i>{{ n.label }}<\/a><\/sc-for><button class=\"nav-link\" data-action=\"frameworks\"><i aria-hidden=\"true\" class=\"ph ph-grid-four\"><\/i>Frameworks<\/button><\/nav>\n<div class=\"rail-divider\"><\/div><nav aria-label=\"Settings\" class=\"rail-secondary\"><button class=\"nav-link\" data-action=\"usage\"><i aria-hidden=\"true\" class=\"ph ph-coins\"><\/i>Billing &amp; usage<\/button><button class=\"nav-link\" data-action=\"account\"><i aria-hidden=\"true\" class=\"ph ph-user-circle\"><\/i>Account &amp; data<\/button><button class=\"nav-link\" data-go=\"setup\"><i aria-hidden=\"true\" class=\"ph ph-sliders\"><\/i>Creator setup<\/button><\/nav>\n<div aria-hidden=\"true\" class=\"rail-note\">Good ideas<br/>start here.<span>↗<\/span><\/div>\n<div class=\"rail-bottom\"><div class=\"credit-card\"><span><strong>250<\/strong> credits<\/span><div aria-hidden=\"true\" class=\"credit-track\"><span><\/span><\/div><div><span>{{ planLabel }} · demo<\/span><button data-action=\"usage\">View <i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/div><\/div>\n<button class=\"creator-switch\" data-action=\"account\"><span class=\"avatar\">A<\/span><span><strong>Alex<\/strong><small>Creator · Brain active<\/small><\/span><i aria-hidden=\"true\" class=\"ph ph-caret-up-down\"><\/i><\/button><\/div>\n<\/aside>\n<div class=\"rp-topbar\" style=\"display:{{ topbarDisplay }}\"><a class=\"wordmark\" data-go=\"studio\" href=\"#studio\"><span aria-hidden=\"true\" class=\"brand-mark\"><b><\/b><b><\/b><b><\/b><\/span>Respin<\/a><span class=\"mobile-creator\"><span class=\"avatar\">A<\/span>Alex · 250 cr<\/span><\/div>\n<main class=\"rp-main\" style=\"padding:{{ mainPad }};min-width:0;max-width:1120px;width:100%;box-sizing:border-box;padding-bottom:{{ mainPadBottom }}\"><div class=\"workspace-toolbar\"><span class=\"workspace-label\"><span class=\"status-dot\"><\/span>Alex’s workspace <span class=\"quiet\">/ Creator Brain active<\/span><\/span><div class=\"toolbar-actions\"><button aria-label=\"Search this prototype\" class=\"search-button\" data-action=\"search\"><i aria-hidden=\"true\" class=\"ph ph-search\"><\/i><span>Search your workspace<\/span><kbd>⌘ K<\/kbd><\/button><button class=\"btn btn-new\" data-go=\"studio\"><i aria-hidden=\"true\" class=\"ph ph-plus\"><\/i>New<\/button><\/div><\/div>\n<!-- ============ STUDIO START ============ -->\n<sc-if value=\"{{ s.studioStart }}\"><section class=\"studio-home\">\n<header class=\"creative-hero\"><div class=\"hero-copy\"><span class=\"eyebrow\">TURN IDEAS INTO CONTENT THAT FEELS LIKE YOU<\/span><h1>What are you<br class=\"hero-break\"/> <span>starting with?<\/span><\/h1><p>Pick a starting point. Make it yours. <br/>Alex’s approved voice, strategy and content standards are already here.<\/p><\/div><div aria-hidden=\"true\" class=\"hero-mascot\"><span class=\"handwritten\">Same you.<br/>More ideas.<span>⤵<\/span><\/span><img alt=\"\" src=\"assets/creative-mascot.svg\"/><span class=\"mascot-sticker\">a little spark.<br/>a lot of you.<\/span><\/div><\/header>\n<sc-if value=\"{{ notRestricted }}\"><div class=\"creative-start-grid\"><sc-for as=\"c\" list=\"{{ visualStarts }}\"><button class=\"creative-start {{ c.tone }}\" onclick=\"{{ c.go }}\"><span class=\"card-top\"><span class=\"glossy-icon\"><i aria-hidden=\"true\" class=\"ph {{ c.icon }}\"><\/i><\/span><span class=\"price-pill\">{{ c.price }}<\/span><\/span><span class=\"start-title\">{{ c.title }}<\/span><span class=\"start-body\">{{ c.description }}<\/span><span class=\"card-bottom\"><span class=\"handwritten\">{{ c.note }}<\/span><span class=\"round-arrow\"><i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/span><\/span><span aria-hidden=\"true\" class=\"card-squiggle\">∿<\/span><\/button><\/sc-for><\/div>\n<div class=\"quick-tools-row\"><span class=\"quick-label\">JUST NEED A<br/><strong>little boost?<\/strong><\/span><sc-for as=\"c\" list=\"{{ visualQuicks }}\"><button class=\"quick-tool {{ c.tone }}\" onclick=\"{{ c.go }}\"><span class=\"mini-tool-icon\"><i aria-hidden=\"true\" class=\"ph {{ c.icon }}\"><\/i><\/span><span><strong>{{ c.title }}<\/strong><small>{{ c.short }}<\/small><\/span><span class=\"quick-cost\">{{ c.price }}<\/span><i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/sc-for><\/div><\/sc-if>\n<sc-if value=\"{{ restricted }}\"><div class=\"creative-start-grid free-grid\"><sc-for as=\"c\" list=\"{{ visualQuicks }}\"><button class=\"creative-start {{ c.tone }}\" onclick=\"{{ c.go }}\"><span class=\"card-top\"><span class=\"glossy-icon\"><i aria-hidden=\"true\" class=\"ph {{ c.icon }}\"><\/i><\/span><span class=\"price-pill\">{{ c.price }}<\/span><\/span><span class=\"start-title\">{{ c.title }}<\/span><span class=\"start-body\">{{ c.description }}<\/span><span class=\"card-bottom\"><span class=\"handwritten\">{{ c.note }}<\/span><span class=\"round-arrow\"><i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/span><\/span><\/button><\/sc-for><button class=\"creative-start blue locked-start\" data-action=\"plan\"><span class=\"card-top\"><span class=\"glossy-icon\"><i aria-hidden=\"true\" class=\"ph ph-film-slate\"><\/i><\/span><span class=\"price-pill\"><i aria-hidden=\"true\" class=\"ph ph-lock-simple\"><\/i>Creator+<\/span><\/span><span class=\"start-title\">Full scripts &amp; more<\/span><span class=\"start-body\">Idea to Script, your own material and reference analysis.<\/span><span class=\"locked-action\">Explore sample access <i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/span><\/button><\/div><div class=\"plan-banner\"><i aria-hidden=\"true\" class=\"ph ph-lightning\"><\/i><span><strong>You’re exploring the Free plan<\/strong><small>Hooks, Ideation and Caption are available. Your approved Brain still applies.<\/small><\/span><button class=\"btn btn-secondary\" data-action=\"plan\">Explore full access<\/button><\/div><\/sc-if>\n<section class=\"recent-section\"><div class=\"section-heading\"><h2>Pick up an idea<\/h2><span class=\"sample-label\">Sample drafts<\/span><button class=\"text-button\" data-action=\"drafts\">View all <i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/div><div class=\"recent-grid\"><sc-for as=\"d\" list=\"{{ recentDrafts }}\"><button class=\"recent-draft\" onclick=\"{{ d.go }}\"><img alt=\"{{ d.alt }}\" src=\"{{ d.asset }}\"/><span class=\"recent-copy\"><span class=\"category-tag {{ d.tone }}\">{{ d.kind }}<\/span><strong>{{ d.title }}<\/strong><small>{{ d.meta }}<\/small><\/span><i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/sc-for><\/div><\/section>\n<div class=\"studio-foot\"><div class=\"trust-card\"><span class=\"heart-icon\"><i aria-hidden=\"true\" class=\"ph ph-heart\"><\/i><\/span><div><strong>Your voice. Your rules. Your call.<\/strong><p>See the price before a run. Review flagged details. Stay in control of your Brain.<\/p><details><summary>How the example works<\/summary><p>This is a local, fixed-content prototype. Navigation is free and no live generation, payment or account change occurs. The full draft is shown after the checks stage; checks are not exhaustive or a performance guarantee.<\/p><\/details><\/div><span aria-hidden=\"true\" class=\"handwritten\">Built for creators,<br/>not algorithms. ♡<\/span><\/div><button class=\"film-shortcut\" onclick=\"{{ openSamplePlan }}\"><i aria-hidden=\"true\" class=\"ph ph-film-slate\"><\/i><span>See your idea<br/><strong>scene by scene.<\/strong><\/span><i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/div>\n<\/section><\/sc-if>\n<!-- ============ FOCUSED BRIEF ============ -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ s.brief }}\">\n<div class=\"brief-grid\" style=\"display:grid;grid-template-columns:{{ briefCols }};gap:28px;align-items:start\">\n<div style=\"display:grid;gap:18px;max-width:640px\">\n<button class=\"btn btn-ghost\" onclick=\"{{ backToStart }}\" style=\"white-space:nowrap;justify-self:start;gap:6px;font-size:13px\"><i aria-hidden=\"true\" class=\"ph ph-arrow-left\"><\/i>Change starting point<\/button>\n<header style=\"display:grid;gap:4px\">\n<span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">{{ brief.kicker }}<\/span>\n<h1 style=\"font-size:28px;margin:0\">{{ brief.title }}<\/h1>\n<p style=\"margin:0;color:var(--color-neutral-400);font-size:14px\">{{ brief.sub }}<\/p>\n<\/header>\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ brief.hasKind }}\">\n<div aria-label=\"Kind of material\" class=\"seg\" role=\"group\">\n<sc-for as=\"k\" hint-placeholder-count=\"2\" list=\"{{ materialKinds }}\">\n<button onclick=\"{{ k.go }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;background:transparent;border:0;border-left:{{ k.left }};color:{{ k.color }};box-shadow:{{ k.ring }};font-family:inherit\"><i aria-hidden=\"true\" class=\"ph {{ k.icon }}\"><\/i>{{ k.label }}<\/button>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n<div class=\"field\">\n<label>{{ brief.inputLabel }}<\/label>\n<textarea class=\"input\" data-field=\"briefText\" defaultvalue=\"{{ brief.value }}\" onInput=\"{{ captureBrief }}\" placeholder=\"{{ brief.placeholder }}\" rows=\"5\" style=\"font-size:15px;line-height:1.6\"><\/textarea>\n<span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:4px\">{{ brief.inputNote }}<\/span>\n<\/div>\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ brief.hasShots }}\">\n<div class=\"field\">\n<label>Which shots do you have? (a description, not an upload)<\/label>\n<textarea class=\"input\" data-field=\"briefExtra1\" placeholder=\"e.g. me at the desk talking to camera, a screen recording of the spreadsheet, a whiteboard sketch\" rows=\"3\" style=\"font-size:14px\"><\/textarea>\n<\/div>\n<\/sc-if>\n<div class=\"field\">\n<label>Platform — the disclosure guidance is written for it<\/label>\n<div aria-label=\"Platform\" class=\"seg\" role=\"group\">\n<sc-for as=\"p\" hint-placeholder-count=\"3\" list=\"{{ platforms }}\">\n<button onclick=\"{{ p.go }}\" style=\"display:inline-flex;align-items:center;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;background:transparent;border:0;border-left:{{ p.left }};color:{{ p.color }};box-shadow:{{ p.ring }};font-family:inherit\">{{ p.label }}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--color-surface);font-size:13px\">\n<i aria-hidden=\"true\" class=\"ph ph-brain\" style=\"color:var(--color-accent);font-size:18px\"><\/i>\n<span style=\"color:var(--color-neutral-300)\">Using <strong style=\"font-weight:500;color:var(--color-text)\">Alex's approved voice, strategy and content standards<\/strong> (v2, active). Nothing typed here changes them.<\/span>\n<a href=\"#\" onclick=\"{{ goBrain }}\" style=\"margin-left:auto;white-space:nowrap;font-size:13px\">View<\/a>\n<\/div>\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ brief.hasFramework }}\">\n<details style=\"font-size:13px\">\n<summary style=\"cursor:pointer;color:var(--color-neutral-300)\">Framework and less common settings<\/summary>\n<div style=\"display:grid;gap:12px;margin-top:12px;padding:12px;border-radius:8px;background:var(--color-surface)\">\n<div class=\"field\" style=\"margin:0\"><label>Framework (optional)<\/label>\n<select class=\"input\" data-field=\"briefExtra2\" style=\"font-size:14px\"><option>Let the draft choose from the shared library<\/option><option>Mistake → Cost → Fix (shared)<\/option><option>Alex · Before/After walkthrough (yours)<\/option><\/select>\n<span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:4px\">Shared frameworks and your own are both offered. Choosing one is not evidence the result will perform.<\/span><\/div>\n<div class=\"field\" style=\"margin:0\"><label>Filming constraint (optional)<\/label><input class=\"input\" data-field=\"briefExtra3\" placeholder=\"e.g. talking head only, no screen recording\"/><\/div>\n<\/div>\n<\/details>\n<\/sc-if>\n<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px\">\n<button class=\"btn btn-primary\" onclick=\"{{ generate }}\" style=\"white-space:nowrap;gap:8px;font-size:15px;padding:10px 16px\">{{ brief.cta }}<i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button>\n<span style=\"font-size:12px;color:var(--color-neutral-500)\">Priced every time — there is no included draft. A revision afterwards is 2 credits. Balance 250.<\/span>\n<\/div>\n<\/div>\n<aside class=\"visual-side\" style=\"display:{{ sideDisplay }};flex-direction:column;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--color-divider);font-size:13px;position:sticky;top:22px\">\n<img alt=\"Illustrated input-to-output route\" src=\"{{ briefAsset }}\"/><span class=\"side-label\">How your material takes shape<\/span><span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">{{ brief.sideTitle }}<\/span>\n<sc-for as=\"t\" hint-placeholder-count=\"3\" list=\"{{ brief.side }}\">\n<div style=\"display:flex;gap:8px;color:var(--color-neutral-300);line-height:1.5\"><i aria-hidden=\"true\" class=\"ph ph-check\" style=\"color:var(--color-accent);margin-top:3px\"><\/i><span>{{ t }}<\/span><\/div>\n<\/sc-for>\n<p style=\"margin:6px 0 0;padding-top:10px;border-top:1px solid var(--color-divider);color:var(--color-neutral-500);line-height:1.5\">{{ brief.sideNote }}<\/p>\n<\/aside>\n<\/div>\n<\/sc-if>\n<!-- ============ GENERATING ============ -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ s.generating }}\">\n<div style=\"display:grid;gap:18px;max-width:640px\">\n<header style=\"display:grid;gap:4px\">\n<span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">{{ brief.kicker }}<\/span>\n<h1 style=\"font-size:28px;margin:0\">Preparing your draft<\/h1>\n<\/header>\n<div style=\"display:grid;gap:14px;padding:18px;border-radius:12px;background:var(--color-surface)\">\n<div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:10px;height:10px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--color-accent) 25%, transparent)\"><\/span><span role=\"status\" style=\"font-size:15px\">Preparing your draft…<\/span><\/div>\n<p style=\"margin:0;font-size:13px;color:var(--color-neutral-400);line-height:1.6;max-width:60ch\">This runs in one pass. The whole draft goes through the checks before you see any of it; a draft that fails them is rewritten once. No progress percentage is shown because none is measured.<\/p>\n<div style=\"display:grid;gap:6px;padding:12px;border-radius:8px;background:var(--color-bg);font-size:13px\">\n<span style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Your brief<\/span>\n<span style=\"color:var(--color-neutral-300)\">{{ brief.value }}<\/span>\n<span style=\"color:var(--color-neutral-500)\">{{ brief.kicker }} · {{ platform }} · sample price {{ brief.cost }} credits<\/span>\n<\/div>\n<\/div>\n<button class=\"btn btn-ghost\" onclick=\"{{ finishGenerate }}\" style=\"white-space:nowrap;justify-self:start;font-size:13px\">Prototype: skip to the result <i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button>\n<\/div>\n<\/sc-if>\n<!-- ============ SCRIPT WORKSPACE ============ -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ s.result }}\">\n<div style=\"display:grid;gap:16px\">\n<header class=\"result-header\" style=\"display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap\">\n<div style=\"display:grid;gap:4px;flex:1;min-width:240px\">\n<span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">Idea to Script · {{ platform }} · Original #1 · Alex<\/span>\n<h1 style=\"font-size:26px;margin:0;text-wrap:pretty\">Automating a bad process makes it worse<\/h1>\n<button class=\"btn btn-ghost\" onclick=\"{{ toggleBrief }}\" style=\"white-space:nowrap;justify-self:start;padding:2px 4px;font-size:13px;gap:6px\"><i aria-hidden=\"true\" class=\"ph ph-note\"><\/i>{{ briefToggleLabel }}<\/button>\n<\/div>\n<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n<button class=\"btn btn-secondary\" data-action=\"revision\" style=\"white-space:nowrap;gap:8px\"><i aria-hidden=\"true\" class=\"ph ph-arrows-clockwise\"><\/i>Request revision <span style=\"color:var(--color-neutral-500)\">· 2 credits<\/span><\/button>\n<button class=\"btn btn-ghost\" onclick=\"{{ backToStart }}\" style=\"white-space:nowrap;font-size:13px\">New draft<\/button>\n<\/div>\n<span aria-hidden=\"true\" class=\"workspace-art\"><span class=\"handwritten\">Plan it.<br/>Make it yours.<\/span><span class=\"glossy-icon blue\"><i class=\"ph ph-film-slate\"><\/i><\/span><\/span><\/header>\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ showBrief }}\">\n<div style=\"display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:var(--color-surface);font-size:13px\">\n<span style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600)\">Brief as submitted<\/span>\n<span style=\"color:var(--color-neutral-300)\">{{ brief.value }}<\/span>\n<span style=\"color:var(--color-neutral-500)\">Changing this brief does not change this stored result. Another generation is a new priced request.<\/span>\n<\/div>\n<\/sc-if>\n<div class=\"check-banner\" role=\"status\" style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--color-accent-700);background:color-mix(in srgb, var(--color-accent) 7%, transparent);font-size:13px;flex-wrap:wrap\">\n<i aria-hidden=\"true\" class=\"ph ph-seal-question\" style=\"color:var(--color-accent);font-size:18px\"><\/i>\n<span><strong style=\"font-weight:500\">2 details need checking<\/strong> — a number and a name the draft states that weren't in your brain or your brief.<\/span>\n<span style=\"display:flex;gap:10px;margin-left:auto\"><a href=\"#\" onclick=\"{{ jumpCheck1 }}\" style=\"font-size:13px\">“£400 a month”<\/a><a href=\"#\" onclick=\"{{ jumpCheck2 }}\" style=\"font-size:13px\">“Zapier”<\/a><a href=\"#\" onclick=\"{{ tabChecks }}\" style=\"font-size:13px\">All checks<\/a><\/span>\n<\/div>\n<div aria-label=\"Views of this result\" class=\"result-tabs\" role=\"tablist\" style=\"display:flex;gap:2px;border-bottom:1px solid var(--color-divider);overflow-x:auto;overflow-y:hidden\">\n<sc-for as=\"t\" hint-placeholder-count=\"4\" list=\"{{ resultTabs }}\">\n<button aria-selected=\"{{ t.selected }}\" onclick=\"{{ t.go }}\" role=\"tab\" style=\"display:inline-flex;align-items:center;gap:6px;padding:10px 14px;background:transparent;border:0;border-bottom:2px solid {{ t.border }};color:{{ t.color }};font:inherit;font-size:14px;cursor:pointer;white-space:nowrap\"><i aria-hidden=\"true\" class=\"ph {{ t.icon }}\"><\/i>{{ t.label }}<span style=\"font-size:11px;color:var(--color-neutral-500)\">{{ t.badge }}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<div class=\"handoff-mobile\"><button class=\"btn btn-secondary\" onclick=\"{{ copySpoken }}\"><i aria-hidden=\"true\" class=\"ph ph-copy\"><\/i>Copy script<\/button><button class=\"btn btn-secondary\" onclick=\"{{ exportFixture }}\"><i aria-hidden=\"true\" class=\"ph ph-download-simple\"><\/i>Export + checks<\/button><\/div>\n<div style=\"display:grid;grid-template-columns:{{ resultCols }};gap:28px;align-items:start\">\n<div aria-label=\"{{ panelLabel }}\" id=\"result-panel\" role=\"tabpanel\" style=\"min-width:0\" tabindex=\"0\">\n<!-- Script -->\n<sc-if hint-placeholder-val=\"{{ true }}\" value=\"{{ tab.script }}\">\n<article class=\"result-script\" style=\"display:grid;gap:22px;max-width:66ch\">\n<div style=\"display:grid;gap:10px\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Central point<\/span>\n<p style=\"margin:0;font-size:17px;line-height:1.5;color:var(--color-neutral-200)\">Automating a broken process doesn't save time — it makes the problem faster. Fix the process, then automate.<\/p>\n<div aria-label=\"Story sequence: opening, setup, cost, the fix, close\" class=\"story-ribbon\"><span><i><\/i><small>Opening<\/small><\/span><span><i><\/i><small>Setup<\/small><\/span><span><i><\/i><small>Cost<\/small><\/span><span><i><\/i><small>The fix<\/small><\/span><span><i><\/i><small>Close<\/small><\/span><\/div>\n<\/div>\n<div style=\"display:grid;gap:10px;padding:16px;border-radius:12px;background:var(--color-surface)\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\"><span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">Opening · 0–3s<\/span><span style=\"font-size:11px;color:var(--color-neutral-500)\">mechanic: consensus break<\/span><\/div>\n<p style=\"margin:0;font-size:19px;line-height:1.55\">“Before you automate this process, remove the step nobody needs.”<\/p>\n<details style=\"font-size:13px\"><summary style=\"cursor:pointer;color:var(--color-neutral-400)\">2 alternative openings<\/summary>\n<div style=\"display:grid;gap:8px;margin-top:8px\">\n<p style=\"margin:0;padding:10px;border-radius:8px;background:var(--color-bg);color:var(--color-neutral-300);font-size:15px\">“You automated the mess. Now it happens faster.” <span style=\"font-size:11px;color:var(--color-neutral-500)\">· mistake first<\/span><\/p>\n<p style=\"margin:0;padding:10px;border-radius:8px;background:var(--color-bg);color:var(--color-neutral-300);font-size:15px\">“Delete a step before you add a tool.” <span style=\"font-size:11px;color:var(--color-neutral-500)\">· instruction<\/span><\/p>\n<\/div><\/details>\n<\/div>\n<div style=\"display:grid;grid-template-columns:56px 1fr;row-gap:16px;column-gap:14px;font-size:18px;line-height:1.65\">\n<sc-for as=\"b\" hint-placeholder-count=\"5\" list=\"{{ beats }}\">\n<span style=\"font-size:12px;color:{{ b.tcColor }};padding-top:6px;font-variant-numeric:tabular-nums;border-left:2px solid {{ b.rail }};padding-left:8px;line-height:1.4\">{{ b.tc }}<br/><span style=\"color:var(--color-neutral-600)\">{{ b.name }}<\/span><\/span>\n<p id=\"{{ b.id }}\" style=\"margin:0;color:var(--color-neutral-200);text-wrap:pretty\">{{ b.pre }}<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ b.hasCheck }}\"><mark style=\"background:transparent;color:var(--color-accent-300);border-bottom:1px dashed var(--color-accent);padding-bottom:1px\">{{ b.checkText }}<\/mark><span style=\"font-size:11px;color:var(--color-accent);border:1px dashed var(--color-accent-700);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle;white-space:nowrap\">[check]<\/span><\/sc-if>{{ b.post }}<\/p>\n<\/sc-for>\n<\/div>\n<p style=\"margin:0;font-size:12px;color:var(--color-neutral-500);line-height:1.6\">[check] is the product's marker for “not stated yet”. Where one is offered, it is a suggestion you can take or leave — the draft was not changed. This draft passed the product's hard rules on the first attempt.<\/p>\n<\/article>\n<\/sc-if>\n<!-- Filming plan -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ tab.plan }}\">\n<div style=\"display:grid;gap:16px\">\n<div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center\"><span class=\"scene-status\">5 scenes · select one to see what to say and show<\/span><span class=\"blueprint-note\"><i aria-hidden=\"true\" class=\"ph ph-film-slate\"><\/i>Storyboard sketches<\/span><\/div>\n<div aria-label=\"Choose a scene\" class=\"scene-nav\" role=\"group\">\n<sc-for as=\"d\" list=\"{{ sceneDots }}\"><button aria-label=\"{{ d.label }}\" aria-pressed=\"{{ d.selected }}\" class=\"scene-thumb\" onclick=\"{{ d.go }}\"><img alt=\"\" src=\"{{ d.asset }}\"/><span>{{ d.n }} · {{ d.name }}<\/span><span><small>{{ d.tc }}<\/small><\/span><\/button><\/sc-for>\n<\/div>\n<div class=\"scene-content\" style=\"display:grid;grid-template-columns:{{ planCols }};gap:22px;align-items:start\">\n<div style=\"display:{{ sceneWrapDisplay }};grid-template-columns:{{ sceneCols }};gap:{{ sceneGap }};position:relative;flex-direction:column\">\n<sc-for as=\"sc\" hint-placeholder-count=\"5\" list=\"{{ scenes }}\">\n<article class=\"scene-frame\" id=\"{{ sc.id }}\" style=\"display:{{ sc.display }};gap:10px;padding:14px;border-radius:12px;background:var(--color-surface);border:1px solid {{ sc.border }};box-shadow:{{ sc.shadow }};grid-template-columns:{{ sc.cols }};align-items:start\">\n<div style=\"display:{{ sceneRailDisplay }};flex-direction:column;align-items:center;gap:6px;padding-top:2px\">\n<span style=\"width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid {{ sc.border }};color:var(--color-accent)\">{{ sc.n }}<\/span>\n<span style=\"flex:1;width:1px;background:var(--color-divider);min-height:24px\"><\/span>\n<\/div>\n<div style=\"display:grid;gap:10px;min-width:0\">\n<div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\"><span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">{{ sc.name }} · {{ sc.tc }}<\/span><span style=\"font-size:11px;color:var(--color-neutral-500)\">beat {{ sc.n }}<\/span><\/div>\n<div class=\"scene-fields\" style=\"display:grid;grid-template-columns:{{ sc.fieldCols }};gap:8px 12px;font-size:14px;line-height:1.55\">\n<span style=\"font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:0.06em;padding-top:3px\">Say<\/span><p style=\"margin:0;color:var(--color-neutral-200);font-size:15px\">“{{ sc.say }}”<\/p>\n<span style=\"font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:0.06em;padding-top:3px\">Show<\/span><p style=\"margin:0;color:var(--color-neutral-300)\">{{ sc.show }}<\/p>\n<span style=\"font-size:11px;color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:0.06em;padding-top:3px\">Text<\/span><p style=\"margin:0;color:{{ sc.textColor }}\">{{ sc.text }}<\/p>\n<\/div>\n<span class=\"shot-pill\" style=\"display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:11px;color:var(--color-neutral-400);padding:3px 8px;border-radius:6px;border:1px dashed var(--color-neutral-700)\"><i aria-hidden=\"true\" class=\"ph {{ sc.shotIcon }}\"><\/i>{{ sc.shot }}<\/span><div class=\"scene-next\"><button class=\"btn btn-secondary\" disabled=\"{{ isFirstScene }}\" onclick=\"{{ prevScene }}\"><i class=\"ph ph-arrow-left\"><\/i>Previous scene<\/button><button class=\"btn btn-primary\" disabled=\"{{ isLastScene }}\" onclick=\"{{ nextScene }}\">Next scene<i class=\"ph ph-arrow-right\"><\/i><\/button><\/div>\n<\/div>\n<\/article>\n<\/sc-for>\n<\/div>\n<aside class=\"scene-preview-aside\" style=\"display:{{ sideDisplay }};flex-direction:column;gap:10px;position:sticky;top:22px\">\n<div class=\"story-preview\" style=\"max-height:420px\">\n<span class=\"preview-label\">Planning preview · 9:16<\/span><span class=\"preview-safe\"><\/span>\n<img alt=\"{{ activeScene.alt }}\" src=\"{{ activeScene.asset }}\"/>\n<p>{{ activeScene.text }}<\/p><span class=\"preview-foot\"><span>Scene {{ activeScene.n }} / 5<\/span><span>Not a video<\/span><\/span>\n<\/div>\n<span style=\"font-size:11px;color:var(--color-neutral-500);text-align:center\">Concept sketch, not your footage<\/span>\n<\/aside>\n<\/div>\n<span class=\"plan-text-note\">Illustrations explain shot ideas. They are not extracted frames or generated deliverables.<\/span>\n<\/div>\n<div class=\"filming-handoff\"><span><i aria-hidden=\"true\" class=\"ph ph-info\"><\/i>Planning sketches — not your footage or a rendered video.<\/span><button class=\"btn btn-secondary\" onclick=\"{{ exportFixture }}\"><i aria-hidden=\"true\" class=\"ph ph-download-simple\"><\/i>Export plan &amp; checks<\/button><\/div><\/sc-if>\n<!-- Caption -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ tab.caption }}\">\n<div style=\"display:grid;gap:18px;max-width:66ch\">\n<div style=\"display:grid;gap:8px;padding:16px;border-radius:12px;background:var(--color-surface)\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">Post copy<\/span>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--color-neutral-200)\">Most automation advice skips the boring part: the process was already broken. I spent a year making a bad workflow faster before I deleted the step that caused it. Here's the checklist I use now — before any tool gets involved.<\/p>\n<p style=\"margin:0;font-size:14px;color:var(--color-neutral-400)\">#automation #solobusiness #processfirst #workflow<\/p>\n<\/div>\n<div style=\"display:grid;gap:6px;font-size:13px;color:var(--color-neutral-400);line-height:1.6\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Disclosure · {{ platform }}<\/span>\n<p style=\"margin:0\">This is guidance written by the product about the platform's policy, not from your material. Label the post as AI-assisted where the platform's disclosure setting applies; do not present the checklist as tested on other people's businesses. The product does not advise leaving disclosure out.<\/p>\n<\/div>\n<p style=\"margin:0;font-size:12px;color:var(--color-neutral-500)\">This is text to copy — Respin does not publish anywhere.<\/p>\n<\/div>\n<\/sc-if>\n<!-- Checks -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ tab.checks }}\">\n<div style=\"display:grid;gap:22px;max-width:70ch\">\n<section style=\"display:grid;gap:10px\">\n<h2 style=\"font-size:18px;margin:0\">Details to check <span style=\"font-size:13px;color:var(--color-neutral-500);font-weight:400\">· 2 · nothing was changed in your draft<\/span><\/h2>\n<sc-for as=\"f\" hint-placeholder-count=\"2\" list=\"{{ findings }}\">\n<div class=\"finding-card\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 14px;border-radius:10px;background:var(--color-surface);font-size:14px;align-items:start\">\n<i aria-hidden=\"true\" class=\"ph ph-seal-question\" style=\"color:var(--color-accent);font-size:18px;margin-top:2px\"><\/i>\n<div style=\"display:grid;gap:3px\"><span style=\"color:var(--color-neutral-200)\">“{{ f.token }}” <span class=\"tag tag-neutral\" style=\"margin-left:6px\">{{ f.kind }}<\/span><\/span><span style=\"font-size:13px;color:var(--color-neutral-400);line-height:1.5\">{{ f.note }}<\/span><span style=\"font-size:12px;color:var(--color-accent-300)\">Offered: “{{ f.token }} [check]”<\/span><\/div>\n<a href=\"#\" onclick=\"{{ f.go }}\" style=\"font-size:13px;white-space:nowrap\">Open in script<\/a>\n<\/div>\n<\/sc-for>\n<p style=\"margin:0;font-size:12px;color:var(--color-neutral-500);line-height:1.6\">The scan compares numbers, dates and names against your brain and your brief. It is a recall aid with known false positives, not a complete check; visiting this view does not resolve anything.<\/p>\n<\/section>\n<section style=\"display:grid;gap:8px;font-size:14px;line-height:1.6;color:var(--color-neutral-300)\">\n<h2 style=\"font-size:18px;margin:0;color:var(--color-text)\">Hard rules<\/h2>\n<p style=\"margin:0\">Passed on the first attempt. Your 2 content standards were scored: <strong style=\"font-weight:500;color:var(--color-text)\">Passed<\/strong> — no banned words; <strong style=\"font-weight:500;color:var(--color-text)\">Passed<\/strong> — no fake urgency. These verdicts are a model's opinion of criteria you wrote — advisory, not enforced.<\/p>\n<\/section>\n<section style=\"display:grid;gap:8px;font-size:14px;line-height:1.6;color:var(--color-neutral-300)\">\n<h2 style=\"font-size:18px;margin:0;color:var(--color-text)\">Creative rationale<\/h2>\n<p style=\"margin:0\">Opens on a contrarian instruction because Alex's voice rules favour a mistake the viewer has already made over a promise. The single checklist gives the piece one payoff rather than a list of tools.<\/p>\n<p style=\"margin:0;padding:12px 14px;border-radius:8px;border:1px solid var(--color-neutral-700)\"><strong style=\"font-weight:500;color:var(--color-text)\">Weakest point:<\/strong> the middle beat leans on one anecdote; a viewer without a similar workflow may not see themselves in it.<\/p>\n<p style=\"margin:0;font-size:12px;color:var(--color-neutral-500)\">Rationale never guarantees truth, originality or performance. No result of Alex's has been logged, so nothing here rests on evidence of how their posts do.<\/p>\n<\/section>\n<\/div>\n<\/sc-if>\n<\/div>\n<aside style=\"display:{{ resultSideDisplay }};flex-direction:column;gap:18px;position:sticky;top:22px\">\n<div style=\"display:grid;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--color-divider);font-size:13px\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">Handoff <span style=\"color:var(--color-neutral-500)\">· proposed<\/span><\/span>\n<button class=\"btn btn-secondary\" onclick=\"{{ copySpoken }}\" style=\"white-space:nowrap;justify-content:flex-start;gap:8px;font-size:13px\"><i aria-hidden=\"true\" class=\"ph ph-copy\"><\/i>Copy spoken script<\/button>\n<button class=\"btn btn-secondary\" onclick=\"{{ copyFull }}\" style=\"white-space:nowrap;justify-content:flex-start;gap:8px;font-size:13px\"><i aria-hidden=\"true\" class=\"ph ph-copy\"><\/i>Copy full output<\/button>\n<button class=\"btn btn-secondary\" onclick=\"{{ exportFixture }}\" style=\"white-space:nowrap;justify-content:flex-start;gap:8px;font-size:13px\"><i aria-hidden=\"true\" class=\"ph ph-file-text\"><\/i>Export as Markdown<\/button>\n<span style=\"color:var(--color-neutral-500);line-height:1.5\">Exports carry the [check] markers and the checks. A clean-looking file is not a verified one.<\/span>\n<\/div>\n<div style=\"display:grid;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--color-divider);font-size:13px\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">This session<\/span>\n<div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--color-surface);border:1px solid var(--color-accent-700)\"><span style=\"color:var(--color-accent)\">#1<\/span><span>Original · Idea to Script<\/span><span class=\"tag tag-accent\" style=\"margin-left:auto\">selected<\/span><\/div>\n<span style=\"color:var(--color-neutral-500);line-height:1.5\">A revision is a new draft linked to this one, re-checked from scratch and priced at 2 credits.<\/span>\n<\/div>\n<div style=\"display:grid;gap:8px;font-size:13px;padding:0 4px\">\n<span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Tell the product what you thought<\/span>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<button class=\"btn btn-secondary\" data-feedback=\"I used it as it is\" style=\"white-space:nowrap;font-size:12px;padding:5px 10px\">I used it as it is<\/button>\n -transform:uppercase;color:var(--color-accent)\">{{ c.kicker }}<\/span><span class=\"tag tag-neutral\">{{ c.tag }}<\/span><\/div>\n<p style=\"margin:0;font-size:17px;line-height:1.45;color:var(--color-neutral-100)\">“{{ c.text }}”<\/p>\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ c.hasPoint }}\">\n<p style=\"margin:0;font-size:13px;color:var(--color-neutral-300);line-height:1.5\"><span style=\"color:var(--color-neutral-500)\">Central point · <\/span>{{ c.point }}<\/p>\n<div style=\"display:flex;gap:4px;align-items:center;font-size:11px;color:var(--color-neutral-400)\">\n<sc-for as=\"st\" hint-placeholder-count=\"4\" list=\"{{ c.structure }}\"><span style=\"padding:3px 8px;border-radius:6px;border:1px solid var(--color-neutral-700)\">{{ st }}<\/span><\/sc-for>\n<\/div>\n<button class=\"btn btn-primary\" onclick=\"{{ c.develop }}\" style=\"white-space:nowrap;justify-self:start;font-size:13px;gap:6px;margin-top:4px\">Develop this idea <span style=\"color:var(--color-neutral-400)\">· 12 cr, proposed<\/span><\/button>\n<\/sc-if>\n<\/article>\n<\/sc-for>\n<\/div>\n<p style=\"margin:0;font-size:12px;color:var(--color-neutral-500);max-width:70ch;line-height:1.6\">{{ quick.note }}<\/p>\n<\/div>\n<\/sc-if>\n<!-- ============ REFERENCES ============ -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ s.references }}\">\n<div style=\"display:grid;gap:22px\">\n<header style=\"display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap\">\n<div style=\"display:grid;gap:4px;flex:1\"><span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)\">References<\/span><h1 style=\"font-size:30px;margin:0\">Your references<\/h1><p style=\"margin:0;color:var(--color-neutral-400);font-size:14px\">Other creators' public videos you've added, broken down structurally so you can adapt the shape — never the words.<\/p><\/div>\n<button class=\"btn btn-primary\" onclick=\"{{ addReference }}\" style=\"white-space:nowrap;gap:8px\"><i aria-hidden=\"true\" class=\"ph ph-plus\"><\/i>Add a reference<\/button>\n<\/header>\n<div style=\"display:grid;gap:10px\">\n<sc-for as=\"r\" hint-placeholder-count=\"2\" list=\"{{ refs }}\">\n<button class=\"reference-row\" onclick=\"{{ r.go }}\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;background:var(--color-surface);border:1px solid var(--color-divider);color:var(--color-text);cursor:pointer;font:inherit\" style-hover=\"border-color:var(--color-accent-600)\">\n<span class=\"reference-cover\"><img alt=\"{{ r.alt }}\" src=\"{{ r.asset }}\"/><small>Concept illustration<\/small><\/span>\n<span style=\"display:grid;gap:3px;min-width:0\"><span style=\"font-size:15px\">{{ r.title }}<\/span><span style=\"font-size:12px;color:var(--color-neutral-500)\">{{ r.meta }}<\/span><\/span>\n<span class=\"tag {{ r.tagClass }}\">{{ r.status }}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<section style=\"display:grid;gap:8px;padding-top:10px\">\n<h2 style=\"font-size:18px;margin:0\">Discover<\/h2>\n<div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px dashed var(--color-neutral-700);font-size:13px;color:var(--color-neutral-400);line-height:1.5\"><i aria-hidden=\"true\" class=\"ph ph-info\" style=\"color:var(--color-accent);margin-top:2px\"><\/i><span>Discovery is not connected in this prototype. When available and included in the workspace's plan, eligible items appear only after a compliant refresh and analysis complete. <a href=\"#\">Compare plans<\/a><\/span><\/div>\n<\/section>\n<\/div>\n<\/sc-if>\n<!-- ============ REFERENCE FLOW ============ -->\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ s.refFlow }}\">\n<div style=\"display:grid;gap:20px\">\n<button class=\"btn btn-ghost\" onclick=\"{{ goReferences }}\" style=\"white-space:nowrap;justify-self:start;gap:6px;font-size:13px\"><i aria-hidden=\"true\" class=\"ph ph-arrow-left\"><\/i>Your references<\/button>\n<ol style=\"display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;flex-wrap:wrap\">\n<sc-for as=\"st\" hint-placeholder-count=\"3\" list=\"{{ refSteps }}\">\n<li style=\"display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;color:{{ st.color }};background:{{ st.bg }}\"><span style=\"width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid {{ st.ring }}\">{{ st.n }}<\/span>{{ st.label }}<span style=\"color:var(--color-neutral-500)\">{{ st.cost }}<\/span><\/li>\n<\/sc-for>\n<\/ol>\n<sc-if hint-placeholder-val=\"{{ true }}\" value=\"{{ ref.source }}\">\n<div class=\"brief-grid\" style=\"display:grid;grid-template-columns:{{ briefCols }};gap:28px;align-items:start\">\n<div style=\"display:grid;gap:16px;max-width:640px\">\n<header style=\"display:grid;gap:4px\"><h1 style=\"font-size:28px;margin:0\">Add a reference<\/h1><p style=\"margin:0;color:var(--color-neutral-400);font-size:14px\">A public video link and its transcript. Respin doesn't fetch or transcribe anything — you paste what you have the right to use.<\/p><\/header>\n<div class=\"field\"><label>Video link<\/label><input class=\"input\" placeholder=\"https://\" style=\"font-size:14px\" type=\"url\"/><span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:4px\">A full public address starting with http:// or https://.<\/span><\/div>\n<div class=\"field\"><label>Title (optional)<\/label><input class=\"input\" placeholder=\"Left blank, the link's site is shown instead\" style=\"font-size:14px\"/><\/div>\n<div class=\"field\"><label>Transcript<\/label><textarea class=\"input\" placeholder=\"Paste the full transcript\" rows=\"7\" style=\"font-size:14px\"><\/textarea><span style=\"font-size:12px;color:var(--color-neutral-500);margin-top:4px\">0 of 20,000 characters. The transcript is another creator's work: it is kept to find the structure behind it and is not shown back on this page.<\/span><\ \n<h2 style=\"font-size:18px;margin:0\">Comparisons<\/h2>\n<div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px dashed var(--color-neutral-700);font-size:13px;color:var(--color-neutral-400);line-height:1.5\"><i aria-hidden=\"true\" class=\"ph ph-info\" style=\"color:var(--color-accent);margin-top:2px\"><\/i><span>Not available. These 2 logged results are self-reported, so neither is eligible for numerical comparison. Adding another manual result does not unlock it; eligible connector-verified evidence is required. No chart is estimated.<\/span><\/div>\n<\/section>\n<\/div>\n<\/sc-if>\n<!-- ============ GUIDED SETUP ============ -->\n<sc-if value=\"{{ s.setup }}\"><section class=\"onboarding\"><aside class=\"setup-progress\"><span class=\"eyebrow\">MAKE RESPIN FEEL LIKE YOU<\/span><h2>A little context.<br/><span>A better starting point.<\/span><\/h2><ol><sc-for as=\"w\" list=\"{{ wizardSteps }}\"><li><button aria-current=\"{{ w.current }}\" onclick=\"{{ w.go }}\"><span>{{ w.n }}<\/span><span><strong>{{ w.title }}<\/strong><small>{{ w.note }}<\/small><\/span><sc-if value=\"{{ w.done }}\"><i aria-hidden=\"true\" class=\"ph ph-check\"><\/i><\/sc-if><\/button><\/li><\/sc-for><\/ol><img alt=\"\" src=\"assets/creative-mascot.svg\"/><p class=\"quiet\">Guided example · inputs stay in this tab.<br/>No account is created or activated.<\/p><\/aside>\n<div class=\"setup-work\"><span class=\"eyebrow\">CREATOR SETUP · STEP {{ wizardN }} OF 4<\/span><h1>{{ wizardTitle }}<\/h1><p class=\"setup-sub\">{{ wizardSub }}<\/p>\n<sc-if value=\"{{ wizard.writing }}\"><sc-for as=\"p\" list=\"{{ ownPosts }}\"><div class=\"field\"><label>Your writing · example {{ p.n }}<\/label><textarea class=\"input\" data-wizard-field=\"{{ p.key }}\" defaultvalue=\"{{ p.value }}\" placeholder=\"Paste something you wrote, not another creator’s post.\" rows=\"3\"><\/textarea><\/div><\/sc-for><p class=\"quiet\">Three own-writing samples in this guided example. Other creators’ work belongs under References.<\/p><\/sc-if>\n<sc-if value=\"{{ wizard.audience }}\"><div class=\"field\"><label>Primary audience<\/label><input class=\"input\" data-wizard-field=\"audience\" defaultvalue=\"{{ wizardValues.audience }}\"/><\/div><div class=\"field\"><label>What should they leave with?<\/label><input class=\"input\" data-wizard-field=\"takeaway\" defaultvalue=\"{{ wizardValues.takeaway }}\" placeholder=\"One process change they can make this week\"/><\/div><div class=\"field\"><label>Content goals — pick up to 3<\/label><div class=\"goal-options\"><sc-for as=\"g\" list=\"{{ wizardGoals }}\"><button aria-pressed=\"{{ g.selected }}\" class=\"goal-chip\" onclick=\"{{ g.go }}\"><i aria-hidden=\"true\" class=\"ph {{ g.icon }}\"><\/i>{{ g.name }}<\/button><\/sc-for><\/div><\/div><div class=\"field\"><label>The metric you judge content by (optional)<\/label><input class=\"input\" data-wizard-field=\"metric\" defaultvalue=\"{{ wizardValues.metric }}\"/><\/div><span class=\"quiet\">Your declared goal, not a connection to analytics.<\/span><\/sc-if>\n<sc-if value=\"{{ wizard.preferences }}\"><div class=\"field\"><label>How should your content sound?<\/label><textarea class=\"input\" data-wizard-field=\"tone\" defaultvalue=\"{{ wizardValues.tone }}\" rows=\"3\"><\/textarea><\/div><div class=\"field\"><label>Words to avoid<\/label><input class=\"input\" data-wizard-field=\"banned\" defaultvalue=\"{{ wizardValues.banned }}\"/><\/div><div class=\"field\"><label>Styles to avoid<\/label><textarea class=\"input\" data-wizard-field=\"styles\" defaultvalue=\"{{ wizardValues.styles }}\" rows=\"3\"><\/textarea><\/div><div class=\"context-callout\"><i aria-hidden=\"true\" class=\"ph ph-brain\"><\/i><span>These become proposed preferences. You review them before they are active.<\/span><\/div><\/sc-if>\n<sc-if value=\"{{ wizard.review }}\"><div class=\"setup-review\"><span class=\"category-tag lavender\">DRAFT · NOT ACTIVE<\/span><h3>Your example Creator Brain<\/h3><dl><dt>Writing samples<\/dt><dd>3 examples supplied<\/dd><dt>Audience<\/dt><dd>{{ wizardValues.audience }}<\/dd><dt>Goals<\/dt><dd>{{ wizardGoalsText }}<\/dd><dt>Voice<\/dt><dd>{{ wizardValues.tone }}<\/dd><dt>Avoid<\/dt><dd>{{ wizardValues.banned }}<\/dd><\/dl><label class=\"confirm-label\"><input data-wizard-field=\"confirmed\" type=\"checkbox\"/>I have reviewed this example context.<\/label><\/div><p class=\"quiet\">This is an authored review fixture, not an inferred Brain. The production interview and confirmation checks still need their complete implementation.<\/p><\/sc-if>\n<div class=\"wizard-actions\"><button class=\"btn btn-secondary\" disabled=\"{{ wizardFirst }}\" onclick=\"{{ wizardBack }}\"><i aria-hidden=\"true\" class=\"ph ph-arrow-left\"><\/i>Back<\/button><span class=\"quiet\">Kept in this tab<\/span><button class=\"btn btn-primary\" onclick=\"{{ wizardNext }}\">{{ wizardCTA }}<i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/button><\/div><\/div><\/section><\/sc-if>\n<\/main>\n<nav aria-label=\"Product\" class=\"rp-bottomnav\" style=\"display:{{ bottomNavDisplay }};position:fixed;bottom:0;left:0;right:0;justify-content:space-around;padding:6px 4px 10px;background:var(--color-bg);border-top:1px solid var(--color-divider);z-index:3\">\n<sc-for as=\"n\" hint-placeholder-count=\"4\" list=\"{{ nav }}\">\n<a href=\"#\" onclick=\"{{ n.go }}\" style=\"display:grid;justify-items:center;gap:2px;min-width:64px;min-height:44px;padding:4px 8px;text-decoration:none;font-size:10px;color:{{ n.color }}\"><i aria-hidden=\"true\" class=\"ph {{ n.icon }}\" style=\"font-size:20px\"><\/i>{{ n.label }}<\/a>\n<\/sc-for>\n<\/nav>\n<\/div>\n", "styles": "", "js": "\nclass BaseComponent extends DCLogic {\n  state = {\n    screen: this.props.screen ?? \"studio-start\",\n    route: this.props.route ?? \"idea\",\n    material: \"written\",\n    platform: \"YouTube Shorts\",\n    tab: this.props.tab ?? \"script\",\n    scene: 0,\n    showBrief: false,\n    r a: \"Creator plan and up\", metaIcon: \"ph-lock-simple\", metaColor: dim } : null;\n    const card = (id, icon, title, body, cost, exIn, exOut, lockable) => {\n      const locked = lockable && restricted;\n      return { icon, title, body, exIn, exOut, asset: `assets/start-${id === \"material\" ? \"material\" : id === \"reference\" ? \"reference\" : \"idea\"}${mobile ? \"-compact\" : \"\"}.svg`, alt: id === \"idea\" ? \"An idea becomes a structured script\" : id === \"material\" ? \"Owned material becomes a short-form script\" : \"A transcript becomes a story structure\",\n        meta: locked ? lockMeta.meta : `${cost} credits · sample price`,\n        metaIcon: locked ? \"ph-lock-simple\" : \"ph-coins\", metaColor: locked ? dim : muted,\n        locked: locked ? \"true\" : \"false\", opacity: locked ? 0.7 : 1,\n        border: locked ? \"var(--color-divider)\" : \"var(--color-neutral-800)\", shadow: \"none\",\n        inner: startLayout === \"List\" && !mobile ? \"1fr 220px\" : \"1fr\",\n        go: locked ? (e) => e.preventDefault() : this.set({ screen: \"brief\", route: id }) };\n    };\n    const startCards = [\n      card(\"idea\", \"ph-lightbulb\", \"An idea\", \"A topic, an angle or a half-thought. Comes back as a full script with a filming plan.\", costs.idea, \"Automating a broken process just makes it faster\", \"Script · filming plan · caption · checks\", true),\n      card(\"material\", \"ph-article\", \"My own material\", \"Something you wrote, or a description of footage you already have. Turned into a short-form script.\", costs.written, \"My newsletter piece on intake forms (1,200 words)\", \"Script shaped from your text, in your voice\", true),\n      card(\"reference\", \"ph-video\", \"A reference\", \"Another creator's video and transcript. Broken down structurally first; adapting it is a separate step.\", 4, \"youtube.com/… + pasted transcript\", \"Structure breakdown → adapt to your point\", true),\n    ];\n    startCards[2].go = restricted ? (e) => e.preventDefault() : this.set({ screen: \"ref-flow\", refStep: \"source\" });\n    const startCols = mobile ? \"1fr\" : startLayout === \"List\" ? \"1fr\" : \"repeat(3, minmax(0,1fr))\";\n    const routeDefs = {\n      idea: { kicker: \"Idea to Script\", title: \"An idea\", sub: \"One idea in; a script, filming plan, caption and checks out.\", inputLabel: \"What's it about?\", placeholder: \"An idea, an angle, the point you want to make\", value: \"How to automate a process without making it worse. I want to use my own example: a client-intake form I automated that still asked three questions nobody read.\", inputNote: \"Sent to the model provider with Alex's activated brain. Nothing else of yours is sent.\", cost: costs.idea, cta: `Generate script · ${costs.idea} credits`, hasFramework: true, hasKind: false, hasShots: false, sideTitle: \"What helps a first draft\", side: [\"Be specific about the angle, not just the topic\", \"Mention your own example or story\", \"Say who it's for if it differs from your usual audience\", \"Add a filming constraint if you have one\"], sideNote: \"Audience and voice questions aren't asked again — they're already in your approved context.\" },\n      material: { kicker: S.material === \"written\" ? \"Source to Reel\" : \"Footage to Thesis\", title: \"My own material\", sub: S.material === \"written\" ? \"Paste something you wrote. It becomes a short-form script in your voice.\" : \"Describe footage you already have. The draft finds the thesis and the order to cut it in.\", inputLabel: S.material === \"written\" ? \"Paste your written material\" : \"Describe the footage — what happens, roughly how long\", placeholder: S.material === \"written\" ? \"An article, newsletter, thread or notes\" : \"e.g. 4 min of me walking through the intake form; 40s of the old spreadsheet\", value: \"\", inputNote: \"This is a text description, not an upload. Respin doesn't analyse video files.\", cost: S.material === \"written\" ? costs.written : costs.footage, cta: `Generate script · ${S.material === \"written\" ? costs.written : costs.footage} credits`, hasFramework: true, hasKind: true, hasShots: S.material === \"footage\", sideTitle: \"Own material, not a reference\", side: [\"This route is for things you wrote or filmed\", \"Someone else's video belongs under References\", \"Long text is fine — the draft picks one point\"], sideNote: \"Your material is kept distinct from references in your Creator Brain.\" },\n      hooks: { kicker: \"Hooks\", title: \"Hooks\", sub: \"One focused input. Comes back as hook cards with their mechanic named.\", inputLabel: \"What's the piece about?\", placeholder: \"One line is enough\", value: \"Automating a broken process makes it worse\", inputNote: \"\", cost: costs.hooks, cta: `Generate hooks · ${costs.hooks} credits`, hasFramework: false, hasKind: false, hasShots: false, sideTitle: \"Quick tool\", side: [\"No script steps, no filming tabs\", \"5 hooks, each with its mechanic\", \"Copy the one you want\"], sideNote: \"Hooks are checked against your content standards like any draft.\" },\n      caption: { kicker: \"Caption\", title: \"Caption\", sub: \"Post copy and hashtags for something you've already made.\", inputLabel: \"What's the video about, and what should people do after?\", placeholder: \"e.g. my intake-form story; ask them to grab the checklist\", value: \"\", inputNote: \"\", cost: costs.caption, cta: `Generate caption · ${costs.caption} credit`, hasFramework: false, hasKind: false, hasShots: false, sideTitle: \"Quick tool\", side: [\"Copy and hashtags only\", \"Disclosure guidance for the platform you pick\", \"Not a publishing tool\"], sideNote: \"\" },\n      ideation: { kicker: \"Ideation\", title: \"Help me find an idea\", sub: \"A short topic in. Comparable idea cards out — opening, central point and story shape — so you can choose without another run.\", inputLabel: \"Topic or territory\", placeholder: \"e.g. process mistakes solo operators make\", v ">\n<a class=\"wordmark\" data-go=\"studio\" href=\"#studio\"><span aria-hidden=\"true\" class=\"brand-mark\"><b><\/b><b><\/b><b><\/b><\/span>Respin<\/a>\n<nav style=\"display:flex;gap:18px;font-size:14px;flex-wrap:wrap\">\n<a href=\"#how\" style=\"color:var(--color-neutral-300);text-decoration:none\">How it works<\/a>\n<a href=\"#example\" style=\"color:var(--color-neutral-300);text-decoration:none\">Example<\/a>\n<a href=\"#for\" style=\"color:var(--color-neutral-300);text-decoration:none\">For creators<\/a>\n<a href=\"#plans\" style=\"color:var(--color-neutral-300);text-decoration:none\">Plans<\/a>\n<a data-action=\"landing-info\" href=\"#\" style=\"color:var(--color-neutral-300);text-decoration:none\">Changelog<\/a>\n<\/nav>\n<div style=\"display:flex;gap:8px;align-items:center\"><a class=\"btn btn-ghost\" data-action=\"landing-info\" href=\"#\" style=\"font-size:14px;white-space:nowrap\">Sign in<\/a><a class=\"btn btn-primary\" href=\"Respin Redesign.dc.html\" style=\"white-space:nowrap\">See the example<\/a><\/div>\n<\/header>\n<section class=\"landing-hero\" style=\"max-width:1120px;margin:0 auto;padding:64px 32px 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:center\">\n<div style=\"display:grid;gap:18px\">\n<span style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent)\">Idea → script → filming plan<\/span>\n<h1 style=\"font-size:clamp(36px,5vw,56px);line-height:1.05;margin:0;text-wrap:balance;max-width:14ch\">Better content starts before you press record.<\/h1>\n<p style=\"margin:0;font-size:17px;line-height:1.55;color:var(--color-neutral-300);max-width:46ch\">Respin turns an idea, your own material or a reference into a script you can read, a filming plan you can follow and a caption you can copy — in your voice, with flagged details for you to review.<\/p>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\"><a class=\"btn btn-primary\" href=\"Respin Redesign.dc.html\" style=\"font-size:15px;padding:10px 16px;gap:8px;white-space:nowrap\">Try the example workspace<i aria-hidden=\"true\" class=\"ph ph-arrow-right\"><\/i><\/a><span style=\"font-size:12px;color:var(--color-neutral-500)\">Sign-up availability follows the pilot rollout — no instant-access promise here.<\/span><\/div>\n<ul style=\"display:flex;gap:16px;flex-wrap:wrap;list-style:none;margin:4px 0 0;padding:0;font-size:13px;color:var(--color-neutral-400)\">\n<li style=\"display:flex;gap:6px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-check\" style=\"color:var(--color-accent);font-size:14px\"><\/i>Your approved voice, not generic AI<\/li>\n<li style=\"display:flex;gap:6px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-check\" style=\"color:var(--color-accent);font-size:14px\"><\/i>Prices shown before anything runs<\/li>\n<li style=\"display:flex;gap:6px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-check\" style=\"color:var(--color-accent);font-size:14px\"><\/i>Flagged details stay visible<\/li>\n<\/ul>\n<\/div>\n<div class=\"hero-art\">\n<div class=\"hero-art-label\"><span>From a thought to a filming plan<\/span><span>Illustrative example<\/span><\/div>\n<div class=\"hero-input\"><small>Your starting idea<\/small><span>“How to automate a process without making it worse.”<\/span><\/div>\n<div class=\"hero-preview\"><small>SCENE 01 / PLANNING PREVIEW<\/small><span class=\"framing-corners\"><\/span><img alt=\"A storyboard process diagram with an unnecessary step crossed out\" src=\"assets/scene-process.svg\"/><p>Fix the process.<br/>Then automate.<\/p><\/div>\n<div class=\"hero-notes\">\n<div class=\"hero-note\"><strong><i aria-hidden=\"true\" class=\"ph ph-text-align-left\"><\/i>What you say<\/strong><p>“Before you automate this process, remove the step nobody needs.”<\/p><div class=\"mini-chips\"><span>Opening<\/span><span>0–3s<\/span><\/div><\/div>\n<div class=\"hero-note\"><strong><i aria-hidden=\"true\" class=\"ph ph-film-slate\"><\/i>What you show<\/strong><p>A process diagram.<br/>One unnecessary step crossed out.<\/p><\/div>\n<div class=\"hero-note\"><strong><i aria-hidden=\"true\" class=\"ph ph-seal-question\"><\/i>What you check<\/strong><p>Keep unstated figures marked: <b>£400 a month [check]<\/b>.<\/p><\/div>\n<\/div>\n<div class=\"hero-proof\"><i aria-hidden=\"true\" class=\"ph ph-info\"><\/i>Authored example and concept artwork — not measured output or a finished video.<\/div>\n<\/div>\n<\/section>\n<section class=\"landing-how\" id=\"how\" style=\"max-width:1120px;margin:0 auto;padding:40px 32px;display:grid;gap:22px\">\n<h2 style=\"font-size:28px;margin:0\">How it works<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n<div class=\"how-card\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;background:var(--color-surface)\"><img alt=\"Your approved writing preferences\" src=\"assets/brain-voice.svg\"/><span style=\"font-size:11px;color:var(--color-accent)\">1<\/span><h3 style=\"font-size:18px;margin:0\">Tell us how you write<\/h3><p style=\"margin:0;font-size:14px;color:var(--color-neutral-400);line-height:1.55\">Three of your own posts and a short interview become a Creator Brain — rules you read and confirm before anything is active.<\/p><\/div>\n<div class=\"how-card\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;background:var(--color-surface)\"><img alt=\"Choose a starting idea\" src=\"assets/start-idea.svg\"/><span style=\"font-size:11px;color:var(--color-accent)\">2<\/span><h3 style=\"font-size:18px;margin:0\">Choose a starting point<\/h3><p style=\"margin:0;font-size:14px;color:var(--color-neutral-400);line-height:1.55\">An idea, your own material or a reference. Quick tools for hooks and captions. The price is on the button.<\/p><\/div>\n<div class=\"how-card\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;background:var(--color-surface)\"><img alt=\"A practical filming plan\" src=\"assets/scene-whiteboard.svg\"/><span style=\"font-size:11px;color:var(--color-accent)\">3<\/span><h3 style=\"font-size:18px;margin:0\">Read, check, film<\/h3><p style=\"margin:0;font-size:14px;color:var(--color-neutral-400);line-height:1.55\">One result, four views: script, filming plan, caption, checks. Review the flagged details before recording.<\/p><\/div>\n<\/div>\n<\/section>\n<section id=\"example\" style=\"background:var(--color-section);padding:48px 32px\">\n<div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;align-items:start\">\n<div style=\"display:grid;gap:8px\"><span style=\"font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-300)\">What Respin won't do<\/span><h2 style=\"font-size:26px;margin:0;color:var(--color-neutral-100)\">Honesty is part of the product.<\/h2><\/div>\n<ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px;line-height:1.5;color:var(--color-neutral-200)\">\n<li style=\"display:flex;gap:10px\"><i aria-hidden=\"true\" class=\"ph ph-x\" style=\"color:var(--color-accent-300);margin-top:3px\"><\/i>Promise reach, virality or a score. No result of yours is used unless you log it.<\/li>\n<li style=\"display:flex;gap:10px\"><i aria-hidden=\"true\" class=\"ph ph-x\" style=\"color:var(--color-accent-300);margin-top:3px\"><\/i>Treat a source match as proof. Flagged numbers, dates and names still need your review; checks are not exhaustive.<\/li>\n<li style=\"display:flex;gap:10px\"><i aria-hidden=\"true\" class=\"ph ph-x\" style=\"color:var(--color-accent-300);margin-top:3px\"><\/i>Copy a reference. Adaptations too close to the original are withheld and say so.<\/li>\n<li style=\"display:flex;gap:10px\"><i aria-hidden=\"true\" class=\"ph ph-x\" style=\"color:var(--color-accent-300);margin-top:3px\"><\/i>Change your Creator Brain without you. Every rule is confirmed and activated by you.<\/li>\n<\/ul>\n<\/div>\n<\/section>\n<section class=\"landing-audience\" id=\"for\" style=\"max-width:1120px;margin:0 auto;padding:48px 32px;display:grid;gap:22px\">\n<h2 style=\"font-size:28px;margin:0\">Built for people who film their own content<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n<a class=\"audience-card\" data-action=\"landing-info\" href=\"#\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;border:1px solid var(--color-divider);text-decoration:none;color:inherit\"><img alt=\"\" class=\"audience-art\" src=\"assets/brain-voice.svg\"/><i aria-hidden=\"true\" class=\"ph ph-user\" style=\"color:var(--color-accent);font-size:22px\"><\/i><h3 style=\"font-size:18px;margin:0\">Solo creators<\/h3><p style=\"margin:0;font-size:14px;color:var(--color-neutral-400);line-height:1.55\">Consistent ideas in your own voice, with a filming plan you can follow yourself.<\/p><\/a>\n<a class=\"audience-card\" data-action=\"landing-info\" href=\"#\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;border:1px solid var(--color-divider);text-decoration:none;color:inherit\"><img alt=\"\" class=\"audience-art\" src=\"assets/brain-goals.svg\"/><i aria-hidden=\"true\" class=\"ph ph-storefront\" style=\"color:var(--color-accent);font-size:22px\"><\/i><h3 style=\"font-size:18px;margin:0\">Small businesses<\/h3><p style=\"margin:0;font-size:14px;color:var(--color-neutral-400);line-height:1.55\">Turn what you already know into short-form content without sounding like everyone else.<\/p><\/a>\n<a class=\"audience-card\" data-action=\"landing-info\" href=\"#\" style=\"display:grid;gap:8px;padding:16px;border-radius:12px;border:1px solid var(--color-divider);text-decoration:none;color:inherit\"><img alt=\"\" class=\"audience-art\" src=\"assets/brain-audience.svg\"/><i aria-hidden=\"true\" class=\"ph ph-chalkboard-teacher\" style=\"color:var(--color-accent);font-size:22px\"><\/i><h3 style=\"font-size:18px; <script>
/* Respin v5 local prototype adapter. Preserves the supplied DC template flows.
   UI-only sample: not a billing, data or generation authority. */
(()=>{
'use strict';
const DATA=JSON.parse(document.getElementById('respin-documents').textContent);
const ASSETS=JSON.parse(document.getElementById('respin-assets').textContent);
const mount=document.getElementById('preview-root');
const formMemory=new Map();let component,activeDoc='studio',viewKey='',activeStyle,rendering=false;let sessionPlan='All tasks available';
const asset=s=>ASSETS[(document.documentElement.dataset.theme||'light')+'/'+s]||ASSETS[s]||s;
const escapeText=x=>String(x??'');
const read=(values,expression)=>{
 const x=expression.trim();
 if(x==='true')return true;if(x==='false')return false;if(x==='null')return null;if(x==='undefined')return undefined;
 if(x.startsWith('!'))return !read(values,x.slice(1));
 if(/^[-\d.]+$/.test(x))return Number(x);
 if(/^(['"]).*\1$/.test(x))return x.slice(1,-1);
 return x.split('.').reduce((v,k)=>v==null?undefined:v[k],values);
};
const bind=(v,s)=>{const whole=s.match(/^\s*{{([^{}]+?)}}\s*$/);if(whole)return read(v,whole[1]);return s.replace(/{{([\s\S]+?)}}/g,(_,x)=>escapeText(read(v,x)));};
const keyFor=()=>[activeDoc,component?.state.screen,component?.state.route,component?.state.material,component?.state.refStep,component?.state.brainTab,component?.state.tab,component?.state.wizardStep].join('|');
function remember(){
 if(!viewKey)return;
 const saved={};
 mount.querySelectorAll('input,textarea,select,details').forEach(el=>{
 const k=el.dataset.rKey;if(!k)return;
 saved[k]={value:el.value,checked:el.checked,open:el.open};
 });formMemory.set(viewKey,saved);
}
function restore(){
 const saved=formMemory.get(viewKey)||{};
 mount.querySelectorAll('input,textarea,select,details').forEach(el=>{
 const d=saved[el.dataset.rKey];if(!d)return;
 if('value' in el)el.value=d.value??'';
 if('checked' in el)el.checked=d.checked??false;
 if(el.tagName==='DETAILS')el.open=!!d.open;
 });
}
function toast(message){
 document.querySelector('.runtime-toast')?.remove();const t=document.createElement('div');t.className='runtime-toast';t.role='status';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),3800);
}window.respinToast=toast;
function attach(node,values,path){
 if(node.nodeType===3){return document.createTextNode(escapeText(bind(values,node.textContent)));}
 if(node.nodeType!==1)return document.createDocumentFragment();
 const tag=node.localName;
 if(tag==='helmet'||tag==='script'||tag==='link')return document.createDocumentFragment();
 if(tag==='sc-if'){
  const frag=document.createDocumentFragment();if(bind(values,node.getAttribute('value')||''))Array.from(node.childNodes).forEach((n,i)=>frag.append(attach(n,values,`${path}.${i}`)));return frag;
 }
 if(tag==='sc-for'){
  const frag=document.createDocumentFragment(),list=bind(values,node.getAttribute('list')||'')||[],name=node.getAttribute('as')||'item';
  if(Array.isArray(list))list.forEach((item,i)=>{const sub={...values,[name]:item,$index:i};Array.from(node.childNodes).forEach((n,j)=>frag.append(attach(n,sub,`${path}:${i}.${j}`)));});return frag;
 }
 const el=document.createElement(tag);el.dataset.rKey=path;let defaultVal,hasClick=false;
 for(const a of node.attributes){
  const k=a.name,val=bind(values,a.value);
  if(k.startsWith('hint-')||k.startsWith('style-'))continue;
  if(k.startsWith('on')){if(typeof val==='function'){const event=k.slice(2).toLowerCase();el.addEventListener(event,(e)=>{if(el.getAttribute('aria-disabled')==='true'){e.preventDefault();toast('Restricted sample state. No plan has been changed.');return;}val(e);});if(event==='click')hasClick=true;}continue;}
  if(k==='defaultvalue'||k==='value'){defaultVal=val;continue;}
  if(k==='defaultchecked'||k==='checked'){el.checked=val!==false;continue;}
  if(k==='disabled'){if(val!==false&&val!=null)el.disabled=true;continue;}
  if(k==='src'){el.dataset.asset=String(val);el.setAttribute(k,asset(String(val)));continue;}
  if(val!==undefined&&val!==null)el.setAttribute(k,String(val));
 }
 Array.from(node.childNodes).forEach((n,i)=>el.append(attach(n,values,`${path}.${i}`)));
 if(defaultVal!==undefined&&'value' in el)el.value=String(defaultVal);
 if(el.tagName==='BUTTON'&&!el.hasAttribute('type'))el.type='button';
 if(el.tagName==='BUTTON'&&!hasClick&&!el.hasAttribute('data-action')&&!el.hasAttribute('data-go')&&!el.hasAttribute('data-feedback')){el.addEventListener('click',e=>{e.preventDefault();toast('Design-only control in this sample. No live request or change was made.');});}
 if(el.tagName==='A'){
  const href=el.getAttribute('href')||'';
  if(href.includes('Respin Redesign')){el.href='#studio';el.addEventListener('click',e=>{e.preventDefault();load('studio',{});});}
  else if(href.includes('Respin Landing')){el.href='#landing';el.addEventListener('click',e=>{e.preventDefault();load('landing',{});});}
  else if(href==='#'&&!hasClick&&!el.hasAttribute('data-action')&&!el.hasAttribute('data-go')){el.addEventListener('click',e=>{e.preventDefault();toast('This destination is not included in the supplied sample.');});}
 }
 if(el.getAttribute('role')==='tab'){
  const selected=el.getAttribute('aria-selected')==='true';el.tabIndex=selected?0:-1;el.setAttribute('aria-controls','result-panel');
  el.id='view-'+el.textContent.trim().split(/\s/)[0].toLowerCase();
 }
 return el;
}
function currentRoute(){
 if(activeDoc!=='studio')return activeDoc;
 const scr=component?.state.screen;
 return scr==='brain'?'brain':scr==='setup'?'setup':['references','ref-flow'].includes(scr)?'references':'studio';
}
function chrome(){
 document.querySelectorAll('[data-review-route]').forEach(b=>b.classList.toggle('active',b.dataset.reviewRoute===currentRoute()));document.body.dataset.screen=activeDoc==='studio'?(component?.state.screen||'studio-start'):activeDoc;
 const choice=document.getElementById('sample-plan');if(choice&&component)choice.value=component.props.plan||'All tasks available';
}
function makeHash(){
 const route=currentRoute();if(activeDoc!=='studio')return '#'+route;
 const q=new URLSearchParams();const st=component.state;
 for(const k of ['screen','route','tab','scene','refStep','brainTab'])if(st[k]!=null)q.set(k,st[k]);
 return '#'+route+'?'+q.toString();
}
function historySave(push=true){
 if(!component)return;const obj={doc:activeDoc,props:component.props,state:component.state};
 try{history[push?'pushState':'replaceState'](obj,'',makeHash());}catch(e){}
}
function enhanceFields(){
 mount.querySelectorAll('.field').forEach((field,i)=>{const label=field.querySelector('label');const input=field.querySelector('input,textarea,select');if(label&&input){if(!input.id)input.id='rp-field-'+i;label.htmlFor=input.id;}});
 mount.querySelectorAll('.rp-bottomnav a').forEach(a=>{const label=a.textContent.trim();const route=currentRoute();if((label==='Studio'&&route==='studio')||(label==='Creator Brain'&&route==='brain')||(label==='References'&&route==='references'))a.setAttribute('aria-current','page');});
 mount.querySelectorAll('[data-field=briefText]').forEach(el=>{el.setAttribute('aria-describedby','brief-demo-note');if(!document.getElementById('brief-demo-note')){const note=document.createElement('small');note.id='brief-demo-note';note.className='quiet';note.textContent='Demo: you can edit this brief. The result remains a fixed example, not an AI response to your input.';el.after(note);}});

function render(){
 if(rendering||!component)return;rendering=true;
 try{
  const focus=document.activeElement,focusKey=focus?.dataset?.rKey,canRestore=['INPUT','TEXTAREA','SELECT'].includes(focus?.tagName),sel=focus?.selectionStart;
  const values={...component.props,...component.renderVals()};
  const tpl=document.createElement('template');tpl.innerHTML=DATA[activeDoc].template;
  const frag=document.createDocumentFragment();Array.from(tpl.content.childNodes).forEach((n,i)=>frag.append(attach(n,values,''+i)));
  mount.replaceChildren(frag);viewKey=keyFor();restore();
  const activeTab=mount.querySelector('[role=tab][aria-selected=true]');const panel=mount.querySelector('[role=tabpanel]');if(activeTab&&panel)panel.setAttribute('aria-labelledby',activeTab.id);
  if(canRestore&&focusKey){const target=mount.querySelector(`[data-r-key="${CSS.escape(focusKey)}"]`);if(target){target.focus({preventScroll:true});try{target.setSelectionRange(sel,sel);}catch(e){}}}
  chrome();enhanceFields();
 }finally{rendering=false;}
}
class DCLogic{
 constructor(props){this.props=props;this.state={};}
 setState(patch,cb){remember();const old=this.state.screen;this.state={...this.state,...(typeof patch==='function'?patch(this.state):patch)};render();historySave(true);if(this.state.screen!==old){window.scrollTo({top:0,behavior:'instant'});const h=mount.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}if(cb)cb();}
}
function defaults(doc){const o={};for(const [k,v]of Object.entries(DATA[doc].props||{}))if(v&&Object.prototype.hasOwnProperty.call(v,'default'))o[k]=v.default;return o;}
function load(doc,overrides={},restoreState=null,save=true){
 remember();activeDoc=doc;
 if(doc==='assets'){assetGallery();chrome();if(save)history.pushState({doc},'','#assets');return;}
 const d=DATA[doc];if(!d){toast('Unknown sample document.');return;}
 activeStyle?.remove();activeStyle=document.createElement('style');activeStyle.textContent=d.styles||'';document.head.append(activeStyle);
 const carry=component?.state;const props={...defaults(doc),plan:sessionPlan,...overrides,mobile:window.innerWidth<=800};sessionPlan=props.plan;
 const Logic=d.js.trim()?new Function('DCLogic',d.js+';return Component;')(DCLogic):class extends DCLogic{renderVals(){return {}}};
 component=new Logic(props);if(carry&&doc==='studio'){for(const k of ['inputByRoute','wizardValues','wizardGoals','wizardStep'])if(carry[k]!==undefined)component.state[k]=carry[k];}for(const k of ['scene','tab','brainTab','refStep','screen','route'])if(k in overrides)component.state[k]=k==='scene'?Number(overrides[k]):overrides[k];
 if(restoreState)component.state={...component.state,...restoreState};
 render();if(save)historySave(true);window.scrollTo({top:0,behavior:'instant'});
}

 const ig=mount.querySelector('.icon-grid');for(const k of DATA.iconNames||[]){const box=document.createElement('div');box.className='icon-tile';const i=document.createElement('i');i.className='ph ph-'+k;i.ariaHidden='true';const t=document.createElement('span');t.textContent=k;box.append(i,t);ig.append(box);}

function fromHash(save=false){const raw=location.hash.slice(1)||'studio', [route,query='']=raw.split('?'), pair=routeDocs[route]||routeDocs.studio;const q=Object.fromEntries(new URLSearchParams(query));load(pair[0],{...pair[1],...q},null,save);}

document.getElementById('sample-plan')?.addEventListener('change',e=>{if(component&&activeDoc==='studio'){remember();component.props.plan=e.target.value;sessionPlan=e.target.value;render();historySave(false);}});

mount.addEventListener('keydown',e=>{
 const t=e.target.closest('[role=tab]');if(!t)return;const list=[...t.parentElement.querySelectorAll('[role=tab]')];let i=list.indexOf(t);
 if(e.key==='ArrowRight')i=(i+1)%list.length;else if(e.key==='ArrowLeft')i=(i+list.length-1)%list.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=list.length-1;else return;
 e.preventDefault();list[i].click();mount.querySelector('[role=tab][aria-selected=true]')?.focus();
});

window.addEventListener('popstate',e=>{if(e.state?.doc)load(e.state.doc,e.state.props||{},e.state.state||null,false);else fromHash(false);});
window.__respinPreview={load,component:()=>component,assets:ASSETS,render,remember,toast,asset,setPlan:value=>{sessionPlan=value;if(component&&activeDoc==='studio'){remember();component.props.plan=value;render();historySave(false);}else load('studio',{plan:value});},activeDoc:()=>activeDoc};

fromHash(false);historySave(false);

<script>
/* Real local controls for the prototype. No requests leave the browser. */
(()=>{
'use strict';

function setTheme(theme,persist=true){

 document.querySelector('meta[name=theme-color]')?.setAttribute('content',theme==='dark'?'#090f22':'#fafbff');
 if(persist)try{localStorage.setItem(THEME_KEY,theme);}catch(_e){}
}
setTheme(root.dataset.theme||'light',false);
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeChoice)));
function close(){if(dialog.open)dialog.close();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
function modal(heading,html,initial){
 if(!dialog.open)returnFocus=document.activeElement;title.textContent=heading;content.innerHTML=html;
 if(!dialog.open)dialog.showModal();
