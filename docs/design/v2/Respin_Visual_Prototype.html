}
document.getElementById('dialog-close').addEventListener('click',close);
dialog.addEventListener('cancel',()=>{setTimeout(()=>{if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});},0);});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
const routes={studio:['studio',{screen:'studio-start'}],landing:['landing',{}],references:['studio',{screen:'references'}],brain:['studio',{screen:'brain',brainTab:'overview'}],setup:['studio',{screen:'setup'}],assets:['assets',{}],filming:['studio',{screen:'result',route:'idea',tab:'plan',scene:0}],script:['studio',{screen:'result',route:'idea',tab:'script'}],ideas:['studio',{screen:'quick-result',route:'ideation'}],hooks:['studio',{screen:'brief',route:'hooks'}],caption:['studio',{screen:'brief',route:'caption'}],results:['studio',{screen:'results'}],breakdown:['studio',{screen:'ref-flow',refStep:'breakdown'}]};
function navigate(key){const p=routes[key];if(!p)return;close();document.querySelectorAll('.prototype-menu[open]').forEach(d=>d.open=false);app.load(p[0],p[1]);}
function exportText(text,name,type='text/markdown;charset=utf-8'){
 const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
const searchable=[
 ['Studio','Choose a starting point','house','studio'],['Sample filming plan','Five scenes with Say / Show / Text','film-slate','filming'],['Sample script','Fix the process. Then automate.','article','script'],['References','Source → Breakdown → Adapt','video','references'],['Sample reference breakdown','How the example is structured','layers','breakdown'],['Creator Brain','Voice, strategy and content standards','brain','brain'],['Hooks','Find your opening · 2 sample credits','lightbulb','hooks'],['Caption','Post copy · 1 sample credit','pencil-simple','caption'],['Ideation example','Three angles on better workflows','note','ideas'],['Creator setup','A four-step guided example','sliders','setup'],['Results','Self-reported example history','chart-line-up','results']
];
function search(){modal('Find your next step',`<p>Search the screens and example drafts in this prototype.</p><label class="field"><span class="quiet">Search this prototype</span><input id="prototype-search" class="input" type="search" placeholder="Try “filming”, “voice” or “hooks”…" autocomplete="off"/></label><div class="search-results" id="search-results"></div>`,'#prototype-search');
 const input=document.getElementById('prototype-search'),results=document.getElementById('search-results');
 const show=()=>{const q=input.value.toLowerCase().trim();const matches=searchable.filter(item=>item.slice(0,2).join(' ').toLowerCase().includes(q));results.innerHTML=matches.map(([n,d,i,r])=>`<button class="search-result" data-go="${r}">${ic(i)}<span><strong>${n}</strong><small>${d}</small></span>${ic('arrow-right')}</button>`).join('')||'<p class="quiet">No matching example. Try another word.</p>';};input.addEventListener('input',show);show();
}
function plan(){modal('Explore the two access states',`<p>This switches the <strong>prototype’s sample state</strong>. It does not subscribe, charge or change your real workspace.</p><div class="dialog-stats"><div class="dialog-stat"><strong>Free</strong><small>Hooks · Ideation · Caption</small></div><div class="dialog-stat"><strong>Creator</strong><small>Full scripts and references, too</small></div></div><div class="dialog-actions"><button class="btn btn-secondary" data-preview-plan="Restricted (Free)">Preview Free</button><button class="btn btn-primary" data-preview-plan="All tasks available">Preview full access ${ic('arrow-right')}</button></div><div class="dialog-notice">${ic('info')}<span>The displayed 250-credit balance and operation prices are illustrative values from your supplied prototype, not a live offer.</span></div>`);}
function usage(){modal('Billing & usage — sample',`<p>A presentation of the existing credit model. No live ledger, payment account or subscription is connected.</p><div class="dialog-stats"><div class="dialog-stat"><strong>250</strong><small>Illustrative credit balance</small></div><div class="dialog-stat"><strong>${app.component()?.props.plan==='Restricted (Free)'?'Free':'Creator'}</strong><small>Selected preview state</small></div></div><table class="cost-table"><thead><tr><th>Operation</th><th>Sample credits</th></tr></thead><tbody><tr><td>Idea to Script / written material</td><td>12</td></tr><tr><td>Footage description</td><td>10</td></tr><tr><td>Reference analysis</td><td>4</td></tr><tr><td>Spin</td><td>8</td></tr><tr><td>Hooks / Ideation / Caption</td><td>2 / 3 / 1</td></tr><tr><td>Requested revision</td><td>2</td></tr></tbody></table><p>Actual prices, limits and balances must come from product configuration and the credit ledger. Theme or tab changes never run a paid operation.</p><button class="btn btn-secondary" data-action="plan">Explore sample access</button>`);}
function account(){modal('Alex’s workspace',`<div class="dialog-notice">${ic('user-circle')}<span><strong>Alex · illustrative creator</strong><br/>Voice, Strategy and Content standards: active sample context.</span></div><p>The prototype uses authored sample content. Form inputs and draft proposals stay in this tab and are not sent to a server. Only your theme choice is saved in this browser’s local storage.</p><div class="dialog-actions"><button class="btn btn-secondary" data-go="setup">Review setup example</button><button class="btn btn-secondary" data-action="brain-export-md">Export sample Brain</button></div><h3>Data and account controls</h3><p>Account deletion, sign-in, billing details and complete creator-data export remain production integrations. They are not simulated as successful operations here.</p>`);}
function frameworks(){modal('Choose a story structure',`<p>These examples come from the shared and creator-specific framework options in your supplied prototype. Selecting one changes the local brief only.</p><div class="framework-option"><span class="category-tag lavender">SHARED</span><h3>Mistake → Cost → Fix</h3><p>Start with the problem. Make its cost concrete. Give one useful correction.</p><div class="framework-strip"><span>Mistake</span><span>Cost</span><span>Fix</span></div><button class="btn btn-secondary" data-framework="Mistake → Cost → Fix (shared)">Use in a brief</button></div><div class="framework-option"><span class="category-tag mint">ALEX’S FRAMEWORK</span><h3>Before / After walkthrough</h3><p>Show the old approach, explain what changed, and make the difference visible.</p><div class="framework-strip"><span>Before</span><span>Change</span><span>After</span></div><button class="btn btn-secondary" data-framework="Alex · Before/After walkthrough (yours)">Use in a brief</button></div>`);}
function drafts(){modal('Example drafts',`<p>A local history concept. This is not a connected, persistent draft library.</p><button class="search-result" data-go="script">${ic('article')}<span><strong>Fix the process. Then automate.</strong><small>Script + filming plan · 2 unresolved checks</small></span>${ic('arrow-right')}</button><button class="search-result" data-go="ideas">${ic('note')}<span><strong>Three fresh workflow angles</strong><small>Ideation · fixed sample content</small></span>${ic('arrow-right')}</button><button class="search-result" data-go="filming">${ic('film-slate')}<span><strong>Scene-by-scene filming plan</strong><small>Planning sketches · not footage</small></span>${ic('arrow-right')}</button>`);}

});
