<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .ua { font-family: 'Times New Roman', Times, serif; font-size: 16px; line-height: normal; color: #000000; background: #ffffff; }
    .ua h1 { font-size: 2em; font-weight: bold; margin: 0.67em 0; }
    .ua p { margin: 1em 0; }
    .ua a { color: #0000ee; text-decoration: underline; }
    .ua a:hover { color: #0000ee; }
    .ua button { font: 400 13.3333px Arial, sans-serif; background: #efefef; color: #000; border: 1px solid #767676; border-radius: 2px; padding: 1px 6px; }
  </style>
</helmet>
<div class="ua" data-screen-label="Studio (as-is)" style="min-height: 400px; background: #ffffff; padding: 8px;">
  <header style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid #ddd;">
    <strong>Maya's workspace</strong>
    <nav style="display: flex; gap: 1rem; font-size: 0.9rem;">
      <a href="#">Onboarding</a>
      <a href="#">Studio</a>
      <a href="#">Usage</a>
      <a href="#">Billing</a>
    </nav>
    <button type="button">Sign out</button>
  </header>
  <main style="padding: 1.5rem;">
    <section>
      <h1>Studio</h1>
      <p>Your workspace is ready. Script generation arrives in a later milestone.</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 400}}"></script>
</body>
</html>
