<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .ua { font-family: 'Times New Roman', Times, serif; font-size: 16px; line-height: normal; color: #000000; background: #ffffff; }
    .ua h1 { font-size: 2em; font-weight: bold; margin: 0.67em 0; }
    .ua p { margin: 1em 0; }
    .ua a { color: #0000ee; text-decoration: underline; }
    .ua a:hover { color: #0000ee; }
    .ua label { display: inline; }
    .ua button { font: 400 13.3333px Arial, sans-serif; background: #efefef; color: #000; border: 1px solid #767676; border-radius: 2px; padding: 1px 6px; }
    .ua input { font: 400 13.3333px Arial, sans-serif; color: #000; background: #fff; border: 1px solid #767676; border-radius: 2px; padding: 1px 2px; }
    .caption { font: 600 11px/1 'Segoe UI', -apple-system, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8a8a; background: #f3f3f3; padding: 10px 16px; border-top: 1px solid #e2e2e2; border-bottom: 1px solid #e2e2e2; }
  </style>
</helmet>
<div class="caption">State: /sign-in</div>
<div class="ua" data-screen-label="Sign in (as-is)" style="padding: 8px; background: #ffffff;">
  <main style="display: grid; place-items: center; min-height: 100vh;">
    <div style="width: 320px; display: grid; gap: 0.75rem;">
      <h1>Sign in</h1>
      <form style="display: grid; gap: 0.5rem;">
        <div style="display: grid; gap: 0.25rem;">
          <label for="si-email">Email</label>
          <input id="si-email" name="email" type="email"></input>
        </div>
        <div style="display: grid; gap: 0.25rem;">
          <label for="si-password">Password</label>
          <input id="si-password" name="password" type="password"></input>
          <p style="color: #555; font-size: 0.85rem; margin: 0;">At least 8 characters.</p>
        </div>
        <button type="button">Sign in</button>
      </form>
      <p><a href="#">New here? Create an account</a></p>
    </div>
  </main>
</div>
<div class="caption">State: /sign-up</div>
<div class="ua" data-screen-label="Sign up (as-is)" style="padding: 8px; background: #ffffff;">
  <main style="display: grid; place-items: center; min-height: 100vh;">
    <div style="width: 320px; display: grid; gap: 0.75rem;">
      <h1>Create your account</h1>
      <form style="display: grid; gap: 0.5rem;">
        <div style="display: grid; gap: 0.25rem;">
          <label for="su-name">Name</label>
          <input id="su-name" name="name" type="text"></input>
        </div>
        <div style="display: grid; gap: 0.25rem;">
          <label for="su-email">Email</label>
          <input id="su-email" name="email" type="email"></input>
        </div>
        <div style="display: grid; gap: 0.25rem;">
          <label for="su-password">Password</label>
          <input id="su-password" name="password" type="password"></input>
          <p style="color: #555; font-size: 0.85rem; margin: 0;">At least 8 characters.</p>
        </div>
        <button type="button">Sign up</button>
      </form>
      <p><a href="#">Already have an account? Sign in</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 900}}"></script>
</body>
</html>
