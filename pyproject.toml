[project]
name = "ugc-intelligence"
version = "0.1.0"
description = "UGC Intelligence — intelligence plane (C1 Pattern Engine + shared Extraction Service)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",  # source-allowlist.yaml is a versioned config artefact (P2-T2); stdlib has no YAML parser
    "scipy>=1.11",  # scipy.stats.spearmanr is the tech-spec-named rank correlation with tie-handling (P4-T3); stdlib has no equivalent
    "statsmodels>=0.14",  # statsmodels.stats.multitest.multipletests is the tech-spec-named Benjamini-Hochberg (P6-T4); reimplementing FDR by hand is the wrong call for a sanctioned stats routine
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/IntelligencePlane/substrate",
    "src/IntelligencePlane/extraction",
    "src/IntelligencePlane/c1_pattern_engine",
]

[tool.pytest.ini_options]
# Match the on-disk directory casing exactly. On a case-sensitive CI runner (Linux) a lowercase
# "tests/architecture" collects ZERO tests and the gate passes green while testing nothing.
testpaths = ["tests/Architecture"]
pythonpath = ["src/IntelligencePlane", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/IntelligencePlane"]

[tool.ruff.lint]
# ADR-0001 and the eval plan, as lint rules where a lint rule can carry them.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
