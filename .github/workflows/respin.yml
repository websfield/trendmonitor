# Respin CI — path-scoped to respin/** (pattern: .github/workflows/cutdown.yml, per R-15).
# Jobs: typecheck, lint, test, build (+ db:check from Phase 2) — build-plan M0.
name: respin

on:
  push:
    branches: [main]
    paths:
      - "respin/**"
      - ".github/workflows/respin.yml"
  pull_request:
    paths:
      - "respin/**"
      - ".github/workflows/respin.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: respin
    services:
      # Real Postgres for the *.docker.test.ts concurrency suites (M1 phase 1):
      # locally they run against docker-compose; in CI this container makes the
      # loud-skip path unreachable — the races are ALWAYS proven here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: respin
          POSTGRES_PASSWORD: respin_ci
          POSTGRES_DB: respin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U respin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://respin:respin_ci@localhost:5432/respin
      TEST_DATABASE_URL: postgres://respin:respin_ci@localhost:5432/respin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from respin/package.json "packageManager"
        with:
          package_json_file: respin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: respin/pnpm-lock.yaml
      # Print tool versions so a CI-vs-local divergence is diagnosable
      # (lesson 2026-08-10: present-and-verified beats present-and-unrun).
      - name: Tool versions
        run: |
          node --version
          pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Apply committed migrations
        # db:check is intentionally offline. This fresh service database makes
        # the gate prove that every committed migration applies in Postgres.
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Concurrency suite ran (no silent skip)
        # The docker suites skip loudly without TEST_DATABASE_URL; in CI the
        # service container guarantees they ran. Fail if the skip marker shows.
        # shell: bash makes GitHub add -o pipefail, so a FAILING suite can't
        # exit green through tee (review round 1).
        shell: bash
        run: |
          pnpm -r test:concurrency 2>&1 | tee /tmp/conc.log
          ! grep -q "SKIPPED — TEST_DATABASE_URL" /tmp/conc.log
      - name: Migration drift check
        run: pnpm db:check
      - name: Build
        run: pnpm build
      # DEPENDENCY VULNERABILITY SCAN (audit 2026-08-17 #18). Nothing watched
      # this tree before: no CI audit step, no dependabot, no renovate, no audit
      # script — so "are any of our pinned dependencies known-vulnerable?" was a
      # question this repo had no way to ask.
      #
      # SCOPE, stated because a scan's scope is exactly what people over-read:
      # this runs at `respin/` and therefore covers the RESPIN workspace's
      # locked tree ONLY. It says nothing about `src/` (UGC Intelligence,
      # Python + .NET) or `cutdown/`, which have their own toolchains and would
      # need their own jobs. Do not read a green respin job as a clean repo.
      #
      # THRESHOLD: high. Anything high or critical fails the build; moderate and
      # low are reported by the non-blocking summary below so they are visible
      # without gating every PR on a transitive advisory nobody can action.
      #
      # EXCEPTION PROCESS: there is no ignore-list flag here on purpose — an
      # allowlist inside the workflow is an exception nobody reviews. To accept
      # a specific advisory, add a `pnpm.auditConfig.ignoreCves` entry in
      # respin/package.json with a comment naming the advisory, why it is not
      # reachable from this code, and who to ask — so the exception lands in a
      # reviewed diff rather than in CI configuration.
      - name: Dependency audit (high/critical fails)
        run: pnpm audit --audit-level high --prod
      - name: Dependency audit — full report (never fails the build)
        if: always()
        run: pnpm audit || true
