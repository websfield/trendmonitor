# Respin CI — path-scoped to respin/** (pattern: .github/workflows/cutdown.yml, per R-15).
# Jobs: typecheck, lint, test, build (+ db:check from Phase 2) — build-plan M0.
name: respin

on:
  push:
    branches: [main]
    paths:
      - "respin/**"
      # EVERY workflow file, not just this one. `pnpm test` below runs
      # `tests/journeys-workflow-triggers.test.ts`, which is the ONLY
      # enforcement of the vendor-key invariant over this directory — and
      # `respin-journeys.yml` is workflow_dispatch-only, so it never fires on
      # a PR. With the filter naming one file, a PR that added
      # `.github/workflows/leak.yml` with the key, or weakened the guard
      # itself, ran no CI at all (batch-3 gate, security HIGH).
      - ".github/workflows/**"
  pull_request:
    paths:
      - "respin/**"
      - ".github/workflows/**"
  # A DAILY RUN, so a newly published advisory is seen without anyone editing
  # respin/ (P9-R10; the audit aged a month on push-only triggers — register
  # 2026-10-05 item 13). It also re-reads SECURITY-EXCEPTIONS.md's review-by
  # dates through tests/journeys-workflow-triggers.test.ts, so a lapsed
  # exception turns this run red on its date.
  #
  # WHO SEES A RED SCHEDULED RUN: a `schedule:` run has no pull-request author,
  # so GitHub's own workflow-failure notification goes to the user who last
  # committed THIS FILE — the repository owner keeps that commit. The failing
  # audit step prints the advisories into the job log, so the notification
  # links to the cause. Paging beyond GitHub's notification is deploy-side:
  # todos.md T-24.
  schedule:
    - cron: "23 4 * * *"

# The token floor, pinned as the other two Respin workflows pin it (P9-R10).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: respin
    services:
      # Real Postgres for the *.docker.test.ts concurrency suites (M1 phase 1):
      # locally they run against docker-compose; in CI this container makes the
      # loud-skip path unreachable — the races are ALWAYS proven here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: respin
          POSTGRES_PASSWORD: respin_ci
          POSTGRES_DB: respin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U respin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://respin:respin_ci@localhost:5432/respin
    steps:
      # Every action pinned by a 40-hex commit SHA (P9-R10; the same pins as
      # respin-visual.yml and respin-journeys.yml, each resolved with
      # `git ls-remote` against its tag on 2026-10-05).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version comes from respin/package.json "packageManager"
        with:
          package_json_file: respin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: respin/pnpm-lock.yaml
      # Print tool versions so a CI-vs-local divergence is diagnosable
      # (lesson 2026-08-10: present-and-verified beats present-and-unrun).
      - name: Tool versions
        run: |
          node --version
          pnpm --version
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Apply committed migrations
        # db:check is intentionally offline. This fresh service database makes
        # the gate prove that every committed migration applies in Postgres.
        env:
          DATABASE_URL: postgres://respin:respin_ci@localhost:5432/respin
        run: pnpm db:migrate
      # Phase 10a (G-15): the startup preflight runs in CI as well as at every
      # server and worker start, so a registry defect never reaches a deploy.
      - name: Startup preflight
        run: pnpm preflight
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Concurrency suite ran (no silent skip)
        # The docker suites skip loudly without TEST_DATABASE_URL; in CI the
        # service container guarantees they ran. Fail if the skip marker shows.
        # shell: bash makes GitHub add -o pipefail, so a FAILING suite can't
        # exit green through tee (review round 1).
        shell: bash
        run: |
          pnpm -r test:concurrency 2>&1 | tee /tmp/conc.log
          ! grep -q "SKIPPED — TEST_DATABASE_URL" /tmp/conc.log
      - name: Migration drift check
        run: pnpm db:check
      - name: Build
        run: pnpm build
      # DEPENDENCY VULNERABILITY SCAN (audit 2026-08-17 #18). Nothing watched
      # this tree before: no CI audit step, no dependabot, no renovate, no audit
      # script — so "are any of our pinned dependencies known-vulnerable?" was a
      # question this repo had no way to ask.
      #
      # SCOPE, stated because a scan's scope is exactly what people over-read:
      # this runs at `respin/` and therefore covers the RESPIN workspace's
      # locked tree ONLY. It says nothing about `src/` (UGC Intelligence,
      # Python + .NET) or `cutdown/`, which have their own toolchains and would
      # need their own jobs. Do not read a green respin job as a clean repo.
      #
      # THRESHOLD: high. Anything high or critical fails the build; moderate and
      # low are reported by the non-blocking summary below so they are visible
      # without gating every PR on a transitive advisory nobody can action.
      #
      # `--prod` SCOPE: this blocking step excludes devDependencies. The dev
      # tree (the browser test runner, tsx, vitest...) is audited, blocking, in
      # respin-journeys.yml before any dependency code runs in the job that
      # holds the vendor key — the one place a dev-only package runs beside a
      # secret (P9-A3).
      #
      # `if: ${{ !cancelled() }}` (P9-A3, gate round 1): this used to be the
      # LAST step and so was skipped on any red earlier step — a PR red for a
      # lint error never learned it had also added a vulnerable dependency. Not
      # `always()`, which would also run it on a cancelled run.
      #
      # EXCEPTION PROCESS: there is no ignore-list flag here on purpose — an
      # allowlist inside the workflow is an exception nobody reviews. To accept
      # a specific advisory, add its GHSA id to `pnpm.auditConfig.ignoreGhsas`
      # in respin/package.json (the key pnpm reads; a CVE-keyed ignore list is
      # silently ineffective for a GHSA id) AND a dated row with a review-by
      # date in respin/SECURITY-EXCEPTIONS.md naming the advisory, why it is
      # not reachable from this code, and who to ask — so the exception lands
      # in a reviewed diff rather than in CI configuration.
      # tests/journeys-workflow-triggers.test.ts holds both halves: every id
      # has a row, and no row's review-by date has passed.
      - name: Dependency audit (high/critical fails)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high --prod
      - name: Dependency audit — full report (never fails the build)
        if: ${{ !cancelled() }}
        run: pnpm audit || true
